# Builds, checks and publishes the Windows x64 zip (build_windows.sh) and the macOS Apple Silicon zip
# (build_macos.sh) in one release. A pushed tag starting with v publishes a GitHub release; a manual run is a dry run
# that stops before publishing and leaves the zips and SHA256SUMS.txt as workflow artifacts.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      # uv's own Python, never one found on the machine: scripts/collect_licenses.py needs its BUILD file.
      UV_PYTHON_PREFERENCE: only-managed
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Install dependencies
        run: uv sync --locked

      # Before the tests, or the tests marked tools skip.
      - name: Fetch the extraction tools
        run: uv run python scripts/fetch_tools.py

      - name: Test
        run: uv run pytest -q -rs

      # Fails when the exe, a bundled tool, a license text, THIRD_PARTY.md or LICENSE.txt is missing from the build.
      - name: Build
        run: bash build_windows.sh

      # A windowless build with a missing module exits without a word, and a missing DLL leaves a "System Error" box
      # (titled after game-chooser.exe) open, so after 15 seconds the app must be running with its own main window,
      # whose title is "Game Chooser (<games>)". It runs from a copy, so nothing it writes beside the exe (games.json)
      # gets into the zip.
      - name: Smoke start
        shell: pwsh
        run: |
          $app = Join-Path $env:RUNNER_TEMP 'GameChooser'
          Copy-Item build\game-chooser.dist $app -Recurse
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'smoke-appdata'
          New-Item -ItemType Directory $env:APPDATA | Out-Null
          $p = Start-Process (Join-Path $app 'game-chooser.exe') -PassThru
          $null = $p.Handle
          Start-Sleep -Seconds 15
          $p.Refresh()
          $exited = $p.HasExited
          $title = $p.MainWindowTitle
          if (-not $exited) { taskkill /PID $p.Id /T /F }
          if ($exited) { throw "game-chooser.exe exited within 15 seconds (exit code $($p.ExitCode))" }
          if ($title -cnotmatch '^Game Chooser \(') { throw "game-chooser.exe showed no Game Chooser window (main window title: '$title')" }

      - name: Package
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then version="$GITHUB_REF_NAME"; else version="${GITHUB_SHA::7}"; fi
          zip="GameChooser-$version-windows-x64.zip"
          mkdir package
          cp -r build/game-chooser.dist package/GameChooser
          (cd package && ../bin/7z.exe a -tzip "../$zip" GameChooser)
          echo "ZIP=$zip" >> "$GITHUB_ENV"

      # archive: false uploads the zip itself; the artifact is named after the file, so it differs from the Mac one.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ env.ZIP }}
          archive: false
          if-no-files-found: error
          overwrite: true

  macos:
    # macos-latest is the newest macOS image on Apple Silicon. Its macOS version does not limit who can run the app:
    # Nuitka takes the minimum macOS from uv's Python, not from the build machine.
    runs-on: macos-latest
    env:
      # uv's own Python, never one found on the machine: scripts/collect_licenses.py needs its BUILD file.
      UV_PYTHON_PREFERENCE: only-managed
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Install dependencies
        run: uv sync --locked

      - name: Fetch the extraction tools
        run: uv run python scripts/fetch_tools.py

      - name: Test
        run: uv run pytest -q -rs

      # Fails when the app, 7zz, a license text, THIRD_PARTY.md or LICENSE.txt is missing, or the signature is bad.
      - name: Build
        run: bash build_macos.sh

      # A missing module or dylib makes the app exit at once, so after 15 seconds it must still be running. That is
      # all this checks: no way to see the app's window without Accessibility or Screen Recording permission was found
      # with evidence that it works on a hosted runner. It runs from a copy with HOME pointed at an empty folder
      # (the config folder and games.json live under HOME on macOS). Its output is always printed and must hold no
      # Traceback (one on a worker thread leaves the app running), and the copy must not differ from the build after.
      - name: Smoke start
        run: |
          app="$RUNNER_TEMP/Game Chooser.app"
          ditto "build/Game Chooser.app" "$app"
          home="$RUNNER_TEMP/smoke-home"
          mkdir "$home"
          log="$RUNNER_TEMP/smoke.log"
          HOME="$home" "$app/Contents/MacOS/game-chooser" > "$log" 2>&1 &
          pid=$!
          sleep 15
          status=0
          if kill -0 "$pid" 2> /dev/null; then
            alive=yes
            kill -KILL "$pid"
            wait "$pid" || true
          else
            alive=no
            wait "$pid" || status=$?
          fi
          cat "$log"
          if [ "$alive" = no ]; then
            echo "game-chooser exited within 15 seconds (exit code $status)"
            exit 1
          fi
          if grep -q Traceback "$log"; then
            echo "game-chooser printed a traceback (above)"
            exit 1
          fi
          if ! diff -r "build/Game Chooser.app" "$app"; then
            echo "game-chooser wrote into its app bundle (above)"
            exit 1
          fi

      # ditto keeps the signature and the symlinks; 7zz or zip would not. The zip is unpacked and checked again.
      - name: Package
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then version="$GITHUB_REF_NAME"; else version="${GITHUB_SHA:0:7}"; fi
          zip="GameChooser-$version-macos-arm64.zip"
          codesign --verify --deep --strict "build/Game Chooser.app"
          ditto -c -k --keepParent "build/Game Chooser.app" "$zip"
          ditto -x -k "$zip" "$RUNNER_TEMP/unzipped"
          codesign --verify --deep --strict "$RUNNER_TEMP/unzipped/Game Chooser.app"
          echo "ZIP=$zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ env.ZIP }}
          archive: false
          if-no-files-found: error
          overwrite: true

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # skip-decompress: a zip uploaded with archive: false comes back as application/zip, which download-artifact
      # would otherwise unpack. Each artifact lands in a folder named after it (dl/<zip name>/), so the next step
      # finds the zip files rather than assuming where they are.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dl
          skip-decompress: true

      - name: Checksums
        run: |
          ls -lR dl
          if [ "$GITHUB_EVENT_NAME" = push ]; then version="$GITHUB_REF_NAME"; else version="${GITHUB_SHA:0:7}"; fi
          win="GameChooser-$version-windows-x64.zip"
          mac="GameChooser-$version-macos-arm64.zip"
          for zip in "$win" "$mac"; do
            mapfile -t found < <(find dl -type f -path "*$zip*")
            if [ "${#found[@]}" -ne 1 ]; then
              echo "Expected one file for $zip in dl, found ${#found[@]}: ${found[*]}"
              exit 1
            fi
            unzip -tq "${found[0]}"
            mv "${found[0]}" "$zip"
          done
          sha256sum "$win" "$mac" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          { echo "WIN=$win"; echo "MAC=$mac"; } >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: SHA256SUMS.txt
          archive: false
          if-no-files-found: error
          overwrite: true

      # gh puts these notes before the generated ones. The Mac steps follow Apple's pages for macOS 15 and later,
      # where Control-click and Open no longer gets past Gatekeeper.
      - name: Publish the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NOTES: >-
            The Windows version is for 64-bit Windows.
            The Mac version is for Macs with Apple silicon only.
            It is not notarized by Apple, so macOS blocks it the first time you open it.
            To open it, first unzip the download if your browser has not already done so, and open the Game Chooser
            app. macOS says it cannot open the app; choose Done, not Move to Trash.
            Then open the Apple menu, choose System Settings, and choose Privacy & Security in the sidebar.
            Scroll down to the Security section and choose Open Anyway.
            This button is there for about an hour after you tried to open the app.
            macOS asks once more whether to open the app; choose Open or Open Anyway, then confirm with your login
            password or Touch ID.
            After that, Game Chooser opens like any other app.
        run: gh release create "$GITHUB_REF_NAME" "$WIN" "$MAC" SHA256SUMS.txt --verify-tag --generate-notes --prerelease --notes "$NOTES"

[project]
name = "game-chooser"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "frozendict>=2.5.1",
    "platform-utils>=1.6.3",
    "pywin32>=312 ; sys_platform == 'win32'",
    "six>=1.17.0",
    "smart-list",
    "wxpython==4.3.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
tracing = [
    "procmon-parser==0.4.0",
]

[tool.uv]
default-groups = ["dev", "tracing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "tools: needs the bundled tools in bin/ (skipped when bin/7z.exe is absent)",
    "windows: touches the real Windows registry or other Windows-only behavior",
]

[tool.uv.sources]
smart-list = { git = "https://github.com/accessibleapps/smart_list", rev = "e1fe4b0ad2f4f5ff758588146c27f5dbaf5d41c1" }

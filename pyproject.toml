[project]
name = "game-chooser"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "frozendict>=2.4.6",
    "platform-utils>=1.6.0",
    "pywin32>=311 ; sys_platform == 'win32'",
    "six>=1.17.0",
    "smart-list",
    "wxpython==4.2.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "tools: needs the bundled tools in bin/ (skipped when bin/7z.exe is absent)",
    "windows: touches the real Windows registry or other Windows-only behavior",
]

[tool.uv.sources]
smart-list = { git = "https://github.com/accessibleapps/smart_list", rev = "2a110818a311a248295c3bfdc91a95ed1caac4c0" }
